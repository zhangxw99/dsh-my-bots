- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          glm:
            apiKeyEnv: GLM_API_KEY
            api: openai-completions
            baseURL: https://open.bigmodel.cn/api/coding/paas/v4
            models:
              - id: glm-5.3-flash
                name: glm-5.3-flash
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: glm
        model: glm-5.3-flash
